
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trái tim hoa hồng 🌹</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: radial-gradient(circle, #54152f, #180b1d);
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #ff9fbd;
        text-shadow: 0 0 20px #ff2768;
        margin-bottom: 12px;
    }

    p {
        color: #ffdce7;
        margin-bottom: 35px;
    }

    #heart {
        display: grid;
        grid-template-columns: repeat(7, 48px);
        gap: 2px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        filter: drop-shadow(0 0 15px #ff174f);
    }

    .rose {
        font-size: 40px;
        line-height: 1.2;
        display: inline-block;
        transition:
            transform 0.8s cubic-bezier(.2,.8,.3,1.3),
            opacity 0.7s;
        transform: translate(0, 0) rotate(0deg) scale(1);
    }

    .rose.burst {
        transform:
            translate(var(--dx), var(--dy))
            rotate(var(--rot))
            scale(0.2);
        opacity: 0;
    }

    .empty {
        width: 48px;
        height: 45px;
    }

    #message {
        margin-top: 35px;
        font-size: 18px;
        color: #ffb4cb;
        min-height: 28px;
    }

    .hint {
        font-size: 13px;
        color: #d6a6ba;
        margin-top: 15px;
    }
</style>
</head>

<body>

<h1>🌹 Trái tim hoa hồng 🌹</h1>
<p>Một trái tim được ghép từ những bông hồng.</p>

<div id="heart" role="button" tabindex="0"
     aria-label="Bấm để làm trái tim hoa hồng tung tóe">

    <span class="empty"></span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="empty"></span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="empty"></span>

    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>

    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>

    <span class="empty"></span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="empty"></span>

    <span class="empty"></span>
    <span class="empty"></span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="rose">🌹</span>
    <span class="empty"></span>
    <span class="empty"></span>

    <span class="empty"></span>
    <span class="empty"></span>
    <span class="empty"></span>
    <span class="rose">🌹</span>
    <span class="empty"></span>
    <span class="empty"></span>
    <span class="empty"></span>

</div>

<div id="message">Một trái tim dành cho những điều đẹp đẽ ❤️</div>
<div class="hint">✨ Bấm vào trái tim để xem phép màu ✨</div>

<script>
    const heart = document.getElementById("heart");
    const roses = document.querySelectorAll(".rose");
    const message = document.getElementById("message");

    let exploding = false;

    function explodeHeart() {
        if (exploding) return;
        exploding = true;

        message.textContent = "🌹 Hoa hồng bay khắp nơi! 💖";

        roses.forEach((rose) => {
            const angle = Math.random() * Math.PI * 2;
            const distance = 100 + Math.random() * 250;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;
            const rotation = Math.random() * 1000 - 500;

            rose.style.setProperty("--dx", dx + "px");
            rose.style.setProperty("--dy", dy + "px");
            rose.style.setProperty("--rot", rotation + "deg");

            rose.classList.add("burst");
        });

        setTimeout(() => {
            roses.forEach((rose) => {
                rose.classList.remove("burst");
            });

            message.textContent = "❤️ Trái tim đã trở về! Bấm tiếp nhé.";

            setTimeout(() => {
                exploding = false;
            }, 900);
        }, 1500);
    }

    heart.addEventListener("click", explodeHeart);

    heart.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            explodeHeart();
        }
    });
</script>

</body>
</html>
