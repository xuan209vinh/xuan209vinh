
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainy Night - Lofi</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  color: #e9efff;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(ellipse at 50% 10%,
    #273752, #10182a 55%, #060912);
}

.scene {
  width: min(850px, 100%);
  text-align: center;
}

h1 {
  font-size: clamp(27px, 5vw, 40px);
  letter-spacing: 7px;
  font-weight: 400;
  margin: 0 0 8px;
  text-shadow: 0 0 25px #a4c8ff88;
}

.subtitle {
  color: #a7b8d4;
  letter-spacing: 4px;
  font-size: 12px;
  margin-bottom: 26px;
}

/* Cửa sổ */
.window {
  height: 310px;
  position: relative;
  overflow: hidden;
  border: 8px solid #273247;
  border-radius: 7px;
  background: linear-gradient(#101a32, #29344e 75%, #111a2b);
  box-shadow: 0 0 45px #000a, inset 0 0 30px #050a17;
}

.moon {
  position: absolute;
  width: 53px;
  height: 53px;
  top: 32px;
  right: 17%;
  border-radius: 50%;
  background: #e1e8f7;
  box-shadow: 0 0 35px #dbe6ff88;
}

.city {
  position: absolute;
  bottom: 0;
  height: 120px;
  width: 100%;
  display: flex;
  align-items: end;
  justify-content: space-around;
  gap: 5px;
}

.building {
  flex: 1;
  max-width: 90px;
  position: relative;
  background: linear-gradient(90deg, #10192a, #202d46, #10192a);
  border-top: 2px solid #34415c;
}

.building:nth-child(1) { height: 60%; }
.building:nth-child(2) { height: 90%; }
.building:nth-child(3) { height: 72%; }
.building:nth-child(4) { height: 100%; }
.building:nth-child(5) { height: 65%; }
.building:nth-child(6) { height: 82%; }
.building:nth-child(7) { height: 52%; }

.building::after {
  content: "";
  position: absolute;
  inset: 10px 8px;
  background: repeating-linear-gradient(
    0deg, transparent 0 12px, #b4cfff44 12px 16px
  );
}

/* Mưa */
.rain {
  position: absolute;
  inset: -100px 0 0;
  pointer-events: none;
  background-image: repeating-linear-gradient(
    105deg, transparent 0 18px, #b9d9ff40 19px,
    transparent 20px 38px
  );
  background-size: 100px 180px;
  animation: rainfall .65s linear infinite;
}

@keyframes rainfall {
  to { background-position: -20px 180px; }
}

/* Hạt sáng bay */
.particles {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.particle {
  position: absolute;
  bottom: -15px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #c8ddff;
  box-shadow: 0 0 10px #9fcaff;
  opacity: 0;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) translateX(0);
    opacity: 0;
  }
  20% { opacity: .8; }
  80% { opacity: .5; }
  100% {
    transform: translateY(-340px) translateX(35px);
    opacity: 0;
  }
}

/* Thanh sóng âm thanh */
.visualizer {
  height: 150px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  padding: 15px 5px 5px;
  overflow: hidden;
}

.bar {
  width: 5px;
  height: 8px;
  border-radius: 10px;
  background: linear-gradient(to top, #657fe8, #b9d9ff);
  box-shadow: 0 0 10px #83aaff55;
  animation: equalize .8s ease-in-out infinite alternate;
  animation-play-state: paused;
}

@keyframes equalize {
  0% { height: 8px; opacity: .55; }
  25% { height: 30px; }
  50% { height: 65px; opacity: 1; }
  75% { height: 22px; }
  100% { height: 95px; opacity: .8; }
}

.visualizer.playing .bar {
  animation-play-state: running;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 5px;
}

button {
  border: 1px solid #526582;
  background: #1b2940;
  color: #edf2ff;
  border-radius: 25px;
  padding: 11px 20px;
  font-size: 14px;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #344763;
  transform: translateY(-2px);
}

#status {
  color: #9daec9;
  font-size: 12px;
  margin-top: 17px;
}

.footer {
  color: #74839d;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 25px;
}

@media (max-width: 500px) {
  .window { height: 250px; }
  .visualizer { gap: 3px; height: 125px; }
  .bar { width: 3px; }
}
</style>
</head>

<body>
<main class="scene">
  <h1>RAINY NIGHT</h1>
  <div class="subtitle">LOFI · RAIN · MEMORIES</div>

  <div class="window">
    <div class="moon"></div>

    <div class="city">
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
    </div>

    <div class="rain"></div>
    <div class="particles" id="particles"></div>
  </div>

  <div class="visualizer" id="visualizer"></div>

  <div class="controls">
    <button id="playBtn">▶ Phát nhạc</button>
    <button id="pauseBtn">Ⅱ Tạm dừng</button>
    <button id="restartBtn">↻ Phát lại</button>
  </div>

  <div id="status">Một chút bình yên giữa đêm mưa 🌙</div>

  <audio id="music" preload="metadata">
    <source src="nhac.mp3" type="audio/mpeg">
  </audio>

  <div class="footer">PUT YOUR HEADPHONES ON · RELAX</div>
</main>

<script>
const music = document.getElementById("music");
const visualizer = document.getElementById("visualizer");
const status = document.getElementById("status");

// Tạo 45 thanh sóng âm
for (let i = 0; i < 45; i++) {
  const bar = document.createElement("div");
  bar.className = "bar";

  // Mỗi thanh chạy lệch thời gian để tạo cảm giác tự nhiên
  bar.style.animationDuration = (0.35 + Math.random() * 0.8) + "s";
  bar.style.animationDelay = (Math.random() * 0.7) + "s";

  visualizer.appendChild(bar);
}

// Tạo những hạt sáng bay trong cửa sổ
const particles = document.getElementById("particles");

for (let i = 0; i < 28; i++) {
  const particle = document.createElement("div");
  particle.className = "particle";
  particle.style.left = Math.random() * 100 + "%";
  particle.style.animationDuration = (5 + Math.random() * 9) + "s";
  particle.style.animationDelay = (Math.random() * 8) + "s";
  particle.style.width = (2 + Math.random() * 3) + "px";
  particle.style.height = particle.style.width;
  particles.appendChild(particle);
}

document.getElementById("playBtn").addEventListener("click", async () => {
  try {
    await music.play();
    visualizer.classList.add("playing");
    status.textContent = "Đang phát nhạc · Hãy thư giãn 🎧";
  } catch (error) {
    status.textContent = "Không phát được nhạc. Kiểm tra file nhac.mp3 nhé!";
  }
});

document.getElementById("pauseBtn").addEventListener("click", () => {
  music.pause();
  visualizer.classList.remove("playing");
  status.textContent = "Tạm dừng một chút 🌙";
});

document.getElementById("restartBtn").addEventListener("click", async () => {
  try {
    music.currentTime = 0;
    await music.play();
    visualizer.classList.add("playing");
    status.textContent = "Bắt đầu lại từ đầu 🎧";
  } catch (error) {
    status.textContent = "Kiểm tra file nhac.mp3 nhé!";
  }
});

music.addEventListener("ended", () => {
  visualizer.classList.remove("playing");
  status.textContent = "Bản nhạc đã kết thúc 🌙";
});
</script>
</body>
</html>
